<!DOCTYPE html>
<html lang="pt-BR" data-tema="noite">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Para você, quando tiver um minutinho</title>
    <meta
      name="description"
      content="Só um espaço para guardar com carinho o que a gente construiu até aqui. Sem pressa e no teu tempo."
    />

    <!-- Preview discreto e elegante para WhatsApp / redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Para você, quando tiver um minutinho" />
    <meta
      property="og:description"
      content="Só um espaço para guardar com carinho o que a gente construiu até aqui. Sem pressa e no teu tempo."
    />
    <meta name="theme-color" content="#120E0D" />

    <!-- Favicon minimalista inline -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23161110'/%3E%3Cpath d='M32 47s-14-8.8-14-19.2C18 22.3 22.3 18 27.6 18c2.9 0 5.5 1.4 7.1 3.5C36.3 19.4 38.9 18 41.8 18 47.1 18 51.4 22.3 51.4 27.8 51.4 38.2 32 47 32 47z' transform='translate(-2.7 0)' fill='%23D9A08B'/%3E%3C/svg%3E"
    />

    <!-- Tipografia editorial -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "zgtf04r2t9");
    </script>
  </head>
  <body>
    <!-- Camada atmosférica e granulação sutil de filme -->
    <div class="ambient-bg" aria-hidden="true">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="film-grain"></div>
    </div>

    <!-- Barra superior minimalista com progresso e trilha sonora opcional -->
    <header class="topbar" id="topbar" aria-label="Navegação da história">
      <div class="topbar-inner">
        <div class="topbar-step" id="topbar-step">
          <span class="step-index" id="step-index">01</span>
          <span class="step-sep">/</span>
          <span class="step-total">04</span>
          <span class="step-label" id="step-label">Início</span>
        </div>

        <nav class="step-dots" id="step-dots" aria-label="Capítulos">
          <button
            type="button"
            class="step-dot is-active"
            data-target="#capa"
            aria-label="Ir para o início"
          ></button>
          <button
            type="button"
            class="step-dot"
            data-target="#capitulo-1"
            aria-label="Ir para memórias"
          ></button>
          <button
            type="button"
            class="step-dot"
            data-target="#capitulo-2"
            aria-label="Ir para fotos"
          ></button>
          <button
            type="button"
            class="step-dot"
            data-target="#capitulo-3"
            aria-label="Ir para a carta"
          ></button>
        </nav>

        <button
          type="button"
          class="music-pill is-hidden"
          id="music-toggle"
          aria-label="Tocar ou pausar música"
          aria-pressed="false"
        >
          <span class="music-bars" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          <span class="music-text" id="music-text">Música</span>
        </button>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </header>

    <!-- Áudio opcional (configurável em dados.js) -->
    <audio id="bg-audio" loop preload="metadata"></audio>

    <main class="jornada" id="jornada">
      <!-- CAPA -->
      <section
        id="capa"
        class="capitulo capitulo-capa is-unlocked is-visible"
        data-step="0"
        data-label="Início"
      >
        <div class="capa-bg is-hidden" id="capa-bg" aria-hidden="true">
          <img class="capa-bg-img" id="capa-bg-img" src="" alt="" />
          <div class="capa-bg-overlay"></div>
        </div>

        <div class="capa-content">
          <span class="eyebrow reveal-item" id="capa-etiqueta"></span>
          <h1 class="capa-titulo reveal-item" id="capa-titulo"></h1>
          <p class="capa-subtitulo reveal-item" id="capa-subtitulo"></p>

          <!-- Player Spotify opcional quando tipo === "spotify" -->
          <div class="spotify-slot is-hidden reveal-item" id="spotify-slot"></div>

          <div class="capa-acao reveal-item">
            <button
              type="button"
              class="btn-next btn-primary"
              id="btn-comecar"
              data-next="#capitulo-1"
            >
              <span id="capa-btn-texto">Começar</span>
              <svg
                class="btn-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14" />
                <path d="m19 12-7 7-7-7" />
              </svg>
            </button>
            <span class="tap-hint">toque para descer devagar</span>
          </div>
        </div>
      </section>

      <!-- CAPÍTULO 1: LINHA DO TEMPO -->
      <section
        id="capitulo-1"
        class="capitulo capitulo-timeline"
        data-step="1"
        data-label="Memórias"
      >
        <div class="capitulo-inner">
          <header class="section-header reveal-item">
            <span class="eyebrow" id="timeline-etiqueta"></span>
            <h2 class="section-titulo" id="timeline-titulo"></h2>
            <p class="section-intro" id="timeline-intro"></p>
          </header>

          <div class="timeline-list" id="timeline-list"></div>

          <div class="section-footer reveal-item">
            <button
              type="button"
              class="btn-next"
              data-next="#capitulo-2"
            >
              <span id="timeline-btn-texto">Ver nossas fotos</span>
              <svg
                class="btn-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14" />
                <path d="m19 12-7 7-7-7" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- CAPÍTULO 2: GALERIA -->
      <section
        id="capitulo-2"
        class="capitulo capitulo-galeria"
        data-step="2"
        data-label="Instantes"
      >
        <div class="capitulo-inner">
          <header class="section-header reveal-item">
            <span class="eyebrow" id="galeria-etiqueta"></span>
            <h2 class="section-titulo" id="galeria-titulo"></h2>
            <p class="section-intro" id="galeria-intro"></p>
          </header>

          <div class="gallery-stack" id="gallery-stack"></div>

          <div class="section-footer reveal-item">
            <button
              type="button"
              class="btn-next"
              data-next="#capitulo-3"
            >
              <span id="galeria-btn-texto">Ler o que escrevi</span>
              <svg
                class="btn-arrow"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 5v14" />
                <path d="m19 12-7 7-7-7" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <!-- CAPÍTULO 3: CARTA -->
      <section
        id="capitulo-3"
        class="capitulo capitulo-carta"
        data-step="3"
        data-label="Carta"
      >
        <div class="capitulo-inner">
          <header class="section-header reveal-item">
            <span class="eyebrow" id="carta-etiqueta"></span>
            <h2 class="section-titulo" id="carta-titulo"></h2>
          </header>

          <article class="letter-card reveal-item" aria-label="Carta pessoal">
            <div class="letter-ornament" aria-hidden="true">✦</div>
            <div class="letter-body" id="carta-paragrafos"></div>
            <footer class="letter-signature">
              <p class="letter-farewell" id="carta-despedida"></p>
              <p class="letter-author" id="carta-autor"></p>
            </footer>
          </article>

          <footer class="page-footer reveal-item">
            <p class="footer-note" id="rodape-texto"></p>
            <button
              type="button"
              class="btn-top"
              id="btn-voltar-topo"
              data-next="#capa"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 19V5" />
                <path d="m5 12 7-7 7 7" />
              </svg>
              <span>Voltar ao início</span>
            </button>
          </footer>
        </div>
      </section>
    </main>

    <!-- Lightbox para ver as fotos em tela cheia -->
    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="Visualização da foto"
    >
      <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
      <div class="lightbox-content">
        <div class="lightbox-top">
          <span class="lightbox-counter" id="lightbox-counter">1 / 3</span>
          <button
            type="button"
            class="lightbox-close"
            id="lightbox-close"
            aria-label="Fechar foto"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div class="lightbox-stage" id="lightbox-stage">
          <button
            type="button"
            class="lightbox-nav lightbox-prev"
            id="lightbox-prev"
            aria-label="Foto anterior"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <figure class="lightbox-figure">
            <img id="lightbox-img" src="" alt="" />
            <figcaption class="lightbox-caption">
              <span class="lightbox-date" id="lightbox-date"></span>
              <strong class="lightbox-title" id="lightbox-title"></strong>
              <span class="lightbox-desc" id="lightbox-desc"></span>
            </figcaption>
          </figure>

          <button
            type="button"
            class="lightbox-nav lightbox-next"
            id="lightbox-next"
            aria-label="Próxima foto"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <script src="dados.js"></script>
    <script src="app.js"></script>
  </body>
</html>
